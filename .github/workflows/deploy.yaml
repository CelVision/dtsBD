name: 🚀 Deploy Website via FTP

on:
  push:
    branches:
      - testversion # Triggers upload whenever you push to main

jobs:
  web-deploy:
    name: Sync Files
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code 1
        uses: actions/checkout@v4

      - name: 📂 Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./ # Adjust path to your server's root web folder